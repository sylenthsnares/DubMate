name: Build Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            tauri-args: ""
          - platform: macos-latest
            tauri-args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install
        working-directory: tauri

      - name: Stage Sidecars (Windows)
        if: matrix.platform == 'windows-latest'
        run: pwsh -File tauri/scripts/stage-sidecars.ps1

      - name: Stage Sidecars (macOS)
        if: matrix.platform == 'macos-latest'
        run: bash tauri/scripts/stage-sidecars.sh

      - name: Build Tauri Desktop Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_DUBMATE_SECRET_KEY: ${{ secrets.DUBMATE_SECRET_KEY }}
        with:
          projectPath: tauri
          args: ${{ matrix.tauri-args }}
          tagName: ${{ github.ref_name }}
          releaseName: "DubMate Studio ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for what changed in this release."
          releaseDraft: false
          prerelease: false
