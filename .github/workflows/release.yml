name: Release

# Bundle and installers are ONE workflow on purpose.
#
# They used to be two: publish-bundle.yml (on push to main) created the GitHub
# release, and build-installer.yml (on push of a v* tag) attached the desktop
# installers. That only ever worked because a human happened to push an annotated
# tag at the same moment the merge landed. When v1.0.9 was merged without one,
# softprops/action-gh-release created the tag itself via the API using
# GITHUB_TOKEN -- and GitHub does not trigger workflows from refs created with the
# default GITHUB_TOKEN. So the installer build silently never ran, and the release
# shipped with only the app bundle. Nothing failed; there was no run to look at.
#
# A job dependency cannot be suppressed that way, so the installers now always
# follow the bundle within the same run.
#
# Users only ever see a complete release. The bundle job creates the release as
# a draft; both installer jobs attach to that draft by its id; the publish job
# makes it public and latest only after it has checked the app bundle, the
# Windows setup and the macOS dmg are all on it. If an installer job fails, the
# release stays a draft: 1.x apps never see it (/releases/latest skips drafts),
# and the next run counts the version as unreleased and reuses the draft.
# build_only runs create no release at all.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build the installers and upload them as workflow artifacts. Publishes nothing: no release, no tag, no update offered to users."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}
      is_new: ${{ steps.check.outputs.is_new }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: ver
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      # Gates the installer matrix. Without this, every push to main would spend
      # ~40 minutes of Windows + macOS runner time rebuilding installers for a
      # version that is already published. A draft (an installer job failed last
      # time) isn't published, so it counts as new and gets rebuilt. Any error
      # other than "not found" stops the run: guessing "new" would turn a
      # published release back into a draft below.
      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if is_draft=$(gh release view "v${{ steps.ver.outputs.VERSION }}" \
               --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>&1); then
            :
          elif grep -q "release not found" <<< "$is_draft"; then
            is_draft=none
          else
            echo "::error::Couldn't check whether v${{ steps.ver.outputs.VERSION }} is released: $is_draft"
            exit 1
          fi
          if [ "$is_draft" = "false" ]; then
            echo "is_new=false" >> $GITHUB_OUTPUT
            echo "::notice::v${{ steps.ver.outputs.VERSION }} is already published. Tests ran, but nothing will be released. Bump VERSION to cut a new release, re-run this workflow manually to rebuild the existing one, or run it with build_only to get installers without publishing."
          else
            echo "is_new=true" >> $GITHUB_OUTPUT
            echo "::notice::v${{ steps.ver.outputs.VERSION }} is new; the bundle and both installers will be published."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg -qq

      # 22.12+ for --experimental-strip-types (worker suite) and default ESM
      # syntax detection in `node --check`.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      # The runner generates its own fixture packs; ffmpeg comes from the step above.
      - name: Run tests
        run: |
          npm ci --prefix tests
          pip install -r requirements.txt -q
          pip install httpx fastapi pytest -q
          python tests/run_all_tests.py

      - name: Create app bundle zip
        run: |
          zip -r app-bundle-v${{ steps.ver.outputs.VERSION }}.zip \
            app.py \
            audio_processor.py \
            pack_loader.py \
            pack_builder.py \
            dubmate/ \
            static/ \
            VERSION \
            requirements.txt \
            requirements_builder.txt \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            -x '*__pycache__*'

      - name: Extract release notes for this version
        run: |
          awk -v hdr="## [${{ steps.ver.outputs.VERSION }}]" '
            index($0, hdr) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::No CHANGELOG.md section found for version ${{ steps.ver.outputs.VERSION }}"
            exit 1
          fi
          echo "--- Release notes ---"
          cat RELEASE_NOTES.md

      # The installer job needs the same text. tauri-action calls updateRelease
      # with whatever releaseBody it is given, so if it is given the wrong thing
      # it overwrites these notes on the published release.
      - name: Upload release notes for the installer job
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 1

      # Gated on the same condition as the installers, and for the same reason.
      # Publishing was previously unconditional while the installers were gated,
      # so any push to main with an unchanged VERSION overwrote the bundle on the
      # already-published release without rebuilding its installers. That left
      # v1.0.9 split: OTA clients pulled new Python and static assets while the
      # .exe and .dmg on the same release still contained the previous build, and
      # the release notes described neither. The two must move together or not
      # at all.
      # build_only runs never publish: nothing reaches users through the updater.
      # A draft, so nobody sees it until the publish job has checked the
      # installers are on it. The tag is created at this commit on publish.
      # A manual rebuild of an already published version (is_new false) stays
      # published, as before: making it a draft would hide the live release
      # for the length of the build, or for good if an installer job failed.
      - name: Create the draft GitHub Release
        id: release
        if: (steps.check.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch') && !inputs.build_only
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.VERSION }}
          name: "DubMate v${{ steps.ver.outputs.VERSION }}"
          body_path: RELEASE_NOTES.md
          files: app-bundle-v${{ steps.ver.outputs.VERSION }}.zip
          draft: ${{ steps.check.outputs.is_new == 'true' }}
          make_latest: false
          target_commitish: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

  installers:
    needs: bundle
    if: needs.bundle.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            tauri-args: ""
          - platform: macos-latest
            tauri-args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: npm install
        working-directory: tauri

      - name: Stage Sidecars (Windows)
        if: matrix.platform == 'windows-latest'
        run: pwsh -File tauri/scripts/stage-sidecars.ps1

      - name: Stage Sidecars (macOS)
        if: matrix.platform == 'macos-latest'
        run: bash tauri/scripts/stage-sidecars.sh

      # Proves the staged layout resolves the engine and its package before an
      # installer is built around it. Windows resolves the resources dir through
      # the '..' entry the staging script adds to the embedded runtime's ._pth;
      # macOS mirrors main.rs (cwd and PYTHONPATH = the app dir).
      - name: Import smoke on staged engine (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cd tauri/src-tauri/resources
          ./python-runtime/python.exe -c "import app, dubmate.common, pedalboard"

      - name: Import smoke on staged engine (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          cd tauri/src-tauri/resources
          PYTHONPATH="$PWD" ./python-runtime/bin/python3 -c "import app, dubmate.common, pedalboard"

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      # Passed explicitly below. With a releaseId, tauri-action leaves the
      # release's name and body alone, but it writes this body into the updater's
      # latest.json, so it must be the real changelog.
      - name: Load release notes into the environment
        shell: bash
        run: |
          {
            echo 'RELEASE_NOTES<<DUBMATE_NOTES_EOF'
            cat RELEASE_NOTES.md
            echo 'DUBMATE_NOTES_EOF'
          } >> "$GITHUB_ENV"

      # Uploads to the bundle job's draft by its id: a draft can't be found by
      # its tag, and a tagName here would make tauri-action create a second,
      # public release. The publish job makes the draft public.
      - name: Build Tauri Desktop Installer
        if: ${{ !inputs.build_only }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the binary by option_env! in main.rs and forwarded to the
          # Python engine at runtime.
          DUBMATE_WORKER_KEY: ${{ secrets.DUBMATE_SECRET_KEY }}
        with:
          projectPath: tauri
          args: ${{ matrix.tauri-args }}
          releaseId: ${{ needs.bundle.outputs.release_id }}
          releaseName: "DubMate v${{ needs.bundle.outputs.version }}"
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: true
          prerelease: false

      # Test builds: no tagName/releaseId, so tauri-action only builds and uploads
      # nothing to a release. The installers are attached to the run instead.
      - name: Build Tauri Desktop Installer (build only)
        if: ${{ inputs.build_only }}
        uses: tauri-apps/tauri-action@v0
        env:
          DUBMATE_WORKER_KEY: ${{ secrets.DUBMATE_SECRET_KEY }}
        with:
          projectPath: tauri
          args: ${{ matrix.tauri-args }}

      - name: Upload installers as workflow artifacts (build only)
        if: ${{ inputs.build_only }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-v${{ needs.bundle.outputs.version }}
          path: |
            tauri/src-tauri/target/**/bundle/nsis/*.exe
            tauri/src-tauri/target/**/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      # Both modes. Tauri renders our custom NSIS template (installer.nsi); if a
      # Tauri update stopped using it or rewrote it, the installer would lose the
      # "Do not uninstall" default on upgrade, the /KEEPDATA reinstall switch and
      # the unticked "remove my data" choice, and uninstalling could delete
      # Pack Builder again. Fail the build instead.
      - name: Check the generated Windows installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $nsi = "tauri/src-tauri/target/release/nsis/x64/installer.nsi"
          if (-not (Test-Path $nsi)) { Write-Host "::error::$nsi wasn't generated"; exit 1 }
          $text = Get-Content -Raw $nsi
          $missing = @("/KEEPDATA", '${If} $ReinstallPageCheck = 0', "Also remove Pack Builder and my DubMate data") |
            Where-Object { -not $text.Contains($_) }
          if ($missing) {
            Write-Host "::error::The generated installer.nsi is missing: $($missing -join ' | '). Tauri isn't using tauri/src-tauri/installer.nsi as it is."
            exit 1
          }
          Write-Host "The generated installer keeps Pack Builder and user data on upgrade and uninstall."

  # The only step that makes a release public. Runs after both installer jobs
  # succeeded, and checks all three assets really are on the draft first. If an
  # installer job failed this is skipped and the release stays a draft.
  publish:
    needs: [bundle, installers]
    if: needs.installers.result == 'success' && !inputs.build_only && needs.bundle.outputs.release_id != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check the installers are on the draft, then publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.bundle.outputs.version }}
        run: |
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "Assets on $TAG:"
          echo "$assets"
          for pattern in '^app-bundle-.*\.zip$' '-setup\.exe$' '\.dmg$'; do
            if ! grep -qE -e "$pattern" <<< "$assets"; then
              echo "::error::$TAG has no asset matching $pattern, so it stays a draft."
              exit 1
            fi
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
