<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DubMate</title>
  <style>
    /* Bundled so the launcher looks like the studio before the engine or the
       internet is up. Latin subsets, SIL Open Font License (fonts/OFL-*.txt). */
    @font-face {
      font-family: "Plus Jakarta Sans";
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url("fonts/PlusJakartaSans-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "JetBrains Mono";
      font-style: normal;
      font-weight: 500 700;
      font-display: swap;
      src: url("fonts/JetBrainsMono-latin.woff2") format("woff2");
    }
    /* The studio's tokens, by the same names (static/css/style.css). */
    :root {
      --background: #12100e;
      --card: #1a1714;
      --secondary: #25201a;
      --secondary-hover: #302922;
      --border: #2d251e;
      --border-wood: #443428;
      --foreground: #f4ede4;
      --foreground-muted: #a89f95;
      --foreground-dim: #73685e;
      --primary: #d97706;
      --primary-hover: #f59e0b;
      --primary-foreground: #12100e;
      --accent-brass: #cca458;
      --accent-red-soft: #fca5a5;
      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    [hidden] {
      display: none !important;
    }
    body {
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      min-height: 100vh;
      padding: 24px;
      user-select: none;
      overflow: hidden;
    }
    .mono {
      font-family: var(--font-mono);
    }

    /* The studio's wordmark (.logo-icon and .logo-title in style.css). */
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--secondary);
      border: 1px solid var(--border-wood);
      color: var(--primary);
    }
    .logo-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--foreground);
    }

    /* --- Splash ------------------------------------------------------------ */
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      min-height: 150px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      margin-bottom: 4px;
      border: 3px solid rgba(217, 119, 6, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      font-size: 15px;
      font-weight: 600;
      color: var(--foreground);
    }
    .detail {
      font-size: 12px;
      color: var(--foreground-muted);
      min-height: 16px;
    }

    /* --- Cards ------------------------------------------------------------- */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--foreground);
    }
    .card-body {
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--foreground-muted);
      user-select: text;
    }
    .card-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 22px;
    }
    .error-card {
      border-color: rgba(252, 165, 165, 0.35);
    }
    .error-icon {
      display: block;
      margin: 0 auto 12px auto;
      color: var(--accent-red-soft);
    }

    /* --- Buttons (the studio's .btn variants) ------------------------------ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn:focus-visible,
    .link-btn:focus-visible {
      outline: 2px solid var(--accent-brass);
      outline-offset: 2px;
    }
    .btn:disabled {
      opacity: 0.55;
      cursor: default;
      transform: none;
    }
    /* Espresso on amber: white was 3.19:1. */
    .btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: rgba(255, 255, 255, 0.1);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-secondary {
      background: var(--secondary);
      color: var(--foreground);
      border-color: var(--border-wood);
    }
    .btn-secondary:hover {
      background: var(--secondary-hover);
    }
    .btn-ghost {
      background: transparent;
      color: var(--foreground-muted);
    }
    .btn-ghost:hover:not(:disabled) {
      background: var(--secondary);
      color: var(--foreground);
    }
    /* A text button: the details toggle and Open in browser. */
    .link-btn {
      background: none;
      border: none;
      padding: 2px 4px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--foreground-muted);
      cursor: pointer;
    }
    .link-btn:hover {
      color: var(--foreground);
      text-decoration: underline;
    }
    .error-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
    }
    .log {
      margin-top: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      color: var(--foreground-muted);
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      max-height: 132px;
      overflow-y: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-align: left;
      user-select: text;
    }

    /* --- Update progress --------------------------------------------------- */
    .stage-label {
      margin-top: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--foreground-muted);
      min-height: 16px;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--secondary);
      border-radius: 4px;
      overflow: hidden;
      margin: 8px 0 10px 0;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--primary-hover));
      transition: width 0.35s ease;
      position: relative;
      overflow: hidden;
    }
    /* Faint travelling sheen so a long, slow download still reads as "alive"
       even while the percentage sits on one number. */
    .progress-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
      transform: translateX(-100%);
      animation: sheen 1.8s ease-in-out infinite;
    }
    .progress-bar.is-idle .progress-fill::after {
      animation: none;
    }
    @keyframes sheen {
      to { transform: translateX(100%); }
    }
    .progress-meta {
      font-size: 12px;
      color: var(--foreground-muted);
      min-height: 16px;
    }

    /* The state stays readable through the text and the bar. */
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
      .progress-fill::after { animation: none; display: none; }
      .progress-fill { transition: none; }
    }
  </style>
</head>
<body>
  <div class="logo" aria-label="DubMate">
    <span class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
        <line x1="12" x2="12" y1="19" y2="22" />
      </svg>
    </span>
    <span class="logo-title" aria-hidden="true">DUBMATE</span>
  </div>

  <div id="splash" class="splash">
    <div class="spinner" aria-hidden="true"></div>
    <p id="status-text" class="status" role="status" aria-live="polite">Starting DubMate</p>
    <p id="detail-text" class="detail mono"></p>
    <button id="btn-restart-slow" class="btn btn-ghost" hidden>Restart DubMate</button>
  </div>

  <section id="updater-box" class="card" aria-labelledby="updater-title" hidden>
    <h1 id="updater-title" class="card-title">Updating DubMate</h1>
    <p id="updater-msg" class="card-body">DubMate restarts when it's done.</p>
    <p id="progress-headline" class="stage-label"></p>
    <div id="progress-bar" class="progress-bar is-idle" role="progressbar" aria-labelledby="updater-title"
      aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <p id="progress-meta" class="progress-meta mono"></p>
    <div class="card-actions">
      <button id="btn-skip-update" class="btn btn-ghost" hidden>Skip this time</button>
    </div>
  </section>

  <section id="error-box" class="card error-card" role="alert" aria-labelledby="error-title"
    aria-describedby="error-msg" hidden>
    <svg class="error-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
      <path d="M12 9v4" />
      <path d="M12 17h.01" />
    </svg>
    <h1 id="error-title" class="card-title">DubMate didn't start</h1>
    <p id="error-msg" class="card-body"></p>
    <div class="card-actions">
      <button id="btn-retry" class="btn btn-primary">Restart DubMate</button>
      <button id="btn-error-secondary" class="btn btn-secondary" hidden>Copy details</button>
    </div>
    <div class="error-links">
      <button id="btn-error-details" class="link-btn" aria-expanded="false" aria-controls="error-raw" hidden>Show details</button>
      <button id="btn-open-browser" class="link-btn" hidden>Open in browser</button>
    </div>
    <pre id="error-raw" class="log" hidden></pre>
  </section>

  <script src="launcher.js"></script>
</body>
</html>
