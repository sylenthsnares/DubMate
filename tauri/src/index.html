<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DubMate Studio Pro</title>
  <style>
    :root {
      --bg: #0d0d10;
      --card: #141419;
      --border: #272732;
      --primary: #d97706;
      --text: #f4f4f6;
      --text-muted: #8b8b9e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      overflow: hidden;
    }
    .splash {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fff;
    }
    .logo span {
      color: var(--primary);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(217, 119, 6, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      font-size: 13px;
      color: var(--text-muted);
      font-family: monospace;
    }
    .updater-box {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      width: 90%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #272732;
      border-radius: 4px;
      overflow: hidden;
      margin: 20px 0 10px 0;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #d97706, #f59e0b);
      transition: width 0.2s;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="splash" class="splash">
    <div class="logo">🎙️ DUBMATE <span>STUDIO PRO</span></div>
    <div class="spinner"></div>
    <div id="status-text" class="status">Starting Studio Engine...</div>
  </div>

  <div id="updater-box" class="updater-box">
    <div class="logo">🎙️ DUBMATE <span>UPDATE</span></div>
    <p id="updater-msg" style="font-size: 13px; color: #a1a1aa; margin-top: 8px;">Applying update...</p>
    <div class="progress-bar">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <div class="progress-meta">
      <span id="progress-percent">0%</span>
      <span id="progress-text">Downloading bundle...</span>
    </div>
  </div>

  <script src="launcher.js"></script>
</body>
</html>
