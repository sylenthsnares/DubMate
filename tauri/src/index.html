<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DubMate</title>
  <style>
    /* Bundled so the launcher looks like the studio before the engine or the
       internet is up. Latin subsets, SIL Open Font License (fonts/OFL-*.txt). */
    @font-face {
      font-family: "Plus Jakarta Sans";
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url("fonts/PlusJakartaSans-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "JetBrains Mono";
      font-style: normal;
      font-weight: 500 700;
      font-display: swap;
      src: url("fonts/JetBrainsMono-latin.woff2") format("woff2");
    }
    /* The studio's tokens, by the same names (static/css/style.css). */
    :root {
      --background: #12100e;
      --card: #1a1714;
      --secondary: #25201a;
      --border: #2d251e;
      --border-wood: #443428;
      --foreground: #f4ede4;
      --foreground-muted: #a89f95;
      --foreground-dim: #73685e;
      --primary: #d97706;
      --primary-hover: #f59e0b;
      --primary-foreground: #12100e;
      --accent-brass: #cca458;
      --accent-red-soft: #fca5a5;
      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
      --danger-bg: rgba(252, 165, 165, 0.08);
      --danger-border: rgba(252, 165, 165, 0.35);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      overflow: hidden;
    }
    .splash {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    /* The studio's wordmark (.logo-icon and .logo-title in style.css). */
    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .logo-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--secondary);
      border: 1px solid var(--border-wood);
      color: var(--primary);
    }
    .logo-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--foreground);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(217, 119, 6, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      font-size: 15px;
      color: var(--foreground);
      font-weight: 600;
    }
    .detail {
      font-size: 12px;
      color: var(--foreground-muted);
      font-family: var(--font-mono);
      max-width: 400px;
      word-break: break-word;
    }
    .updater-box, .error-box {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      width: 90%;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }
    .error-box {
      border-color: var(--danger-border);
    }
    .error-icon {
      display: block;
      margin: 12px auto 6px auto;
      color: var(--accent-red-soft);
    }
    .error-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--foreground);
      margin-bottom: 8px;
    }
    .error-msg {
      font-size: 12px;
      color: var(--accent-red-soft);
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 6px;
      padding: 10px 14px;
      margin: 12px 0 20px 0;
      line-height: 1.4;
      word-break: break-word;
      font-family: var(--font-mono);
      text-align: left;
      max-height: 120px;
      overflow-y: auto;
    }
    .error-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .btn:active {
      transform: translateY(1px);
    }
    .btn:focus-visible {
      outline: 2px solid var(--accent-brass);
      outline-offset: 2px;
    }
    /* Espresso on amber: white was 3.19:1. */
    .btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-secondary {
      background: var(--secondary);
      color: var(--foreground);
      border: 1px solid var(--border-wood);
    }
    .btn-secondary:hover {
      background: #302922; /* --secondary-hover */
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--secondary);
      border-radius: 4px;
      overflow: hidden;
      margin: 20px 0 10px 0;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--primary-hover));
      transition: width 0.35s ease;
      position: relative;
      overflow: hidden;
    }
    /* Faint travelling sheen so a long, slow download still reads as "alive"
       even while the percentage sits on one number. */
    .progress-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
      transform: translateX(-100%);
      animation: sheen 1.8s ease-in-out infinite;
    }
    .progress-bar.is-idle .progress-fill::after {
      animation: none;
    }
    @keyframes sheen {
      to { transform: translateX(100%); }
    }
    /* The state stays readable through the text and the bar. */
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
      .progress-fill::after { animation: none; display: none; }
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--foreground-muted);
      font-family: var(--font-mono);
    }

    /* --- Pack Builder install ------------------------------------------- */
    .stages {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 18px 0 4px 0;
    }
    .stage {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--foreground-muted);
      transition: color 0.3s ease;
    }
    .stage-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border-wood);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .stage-sep {
      width: 14px;
      height: 1px;
      background: var(--border-wood);
    }
    .stage.is-done { color: var(--foreground-muted); }
    .stage.is-done .stage-dot { background: var(--primary); }
    .stage.is-active { color: var(--foreground); }
    .stage.is-active .stage-dot {
      background: var(--primary);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.25);
    }
    .progress-headline {
      font-size: 13px;
      font-weight: 600;
      color: var(--foreground);
      margin-top: 14px;
      min-height: 18px;
    }
    .tech-details {
      margin-top: 16px;
      text-align: left;
    }
    .tech-details summary {
      cursor: pointer;
      font-size: 12px;
      color: var(--foreground-muted);
      font-weight: 600;
      list-style: none;
      text-align: center;
      transition: color 0.15s ease;
    }
    .tech-details summary::-webkit-details-marker { display: none; }
    .tech-details summary:hover { color: var(--foreground-muted); }
    .error-details {
      margin: -8px 0 16px 0;
    }
    .tech-log {
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--foreground-muted);
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      max-height: 96px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: text;
    }
  </style>
</head>
<body>
  <div id="splash" class="splash">
    <div class="logo"><span class="logo-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></span><span class="logo-title">DUBMATE</span></div>
    <div class="spinner"></div>
    <div id="status-text" class="status">Starting DubMate</div>
    <div id="detail-text" class="detail"></div>
  </div>

  <div id="updater-box" class="updater-box">
    <div class="logo"><span class="logo-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></span><span class="logo-title">DUBMATE</span></div>
    <h1 id="updater-title" class="error-title">Updating DubMate</h1>
    <p id="updater-msg" style="font-size: 14px; color: var(--foreground-muted); margin-top: 8px;">Updating DubMate</p>

    <div id="builder-stages" class="stages" style="display: none;">
      <div class="stage" data-stage="preparing"><span class="stage-dot"></span>Prepare</div>
      <div class="stage-sep"></div>
      <div class="stage" data-stage="downloading"><span class="stage-dot"></span>Download</div>
      <div class="stage-sep"></div>
      <div class="stage" data-stage="installing"><span class="stage-dot"></span>Install</div>
      <div class="stage-sep"></div>
      <div class="stage" data-stage="finalizing"><span class="stage-dot"></span>Finish</div>
    </div>

    <div id="progress-headline" class="progress-headline"></div>

    <div id="progress-bar" class="progress-bar is-idle">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <div class="progress-meta">
      <span id="progress-percent">0%</span>
      <span id="progress-text"></span>
    </div>

    <details id="tech-details" class="tech-details" style="display: none;">
      <summary>Details</summary>
      <div id="tech-log" class="tech-log"></div>
    </details>
  </div>

  <div id="error-box" class="error-box">
    <div class="logo"><span class="logo-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></span><span class="logo-title">DUBMATE</span></div>
    <svg class="error-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    <h3 id="error-title" class="error-title">DubMate didn't start</h3>
    <p id="error-msg" class="error-msg">Click Try again, or open DubMate in your browser.</p>
    <details id="error-details" class="tech-details error-details" style="display: none;">
      <summary>Show details</summary>
      <div id="error-raw" class="tech-log"></div>
    </details>
    <div class="error-actions">
      <button id="btn-retry" class="btn btn-primary">Try again</button>
      <button id="btn-open-browser" class="btn btn-secondary">Open in browser</button>
    </div>
  </div>

  <script src="launcher.js"></script>
</body>
</html>
