[package]
name = "dubmate-studio"
version = "1.1.3"
description = "DubMate Studio Pro — Collaborative Voice Acting & Dubbing DAW"
authors = ["DubMate Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
zip = "2"

# Microphone permission on room pages (src/mic_permission.rs). Same versions as
# tauri/wry use; MIT OR Apache-2.0.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"
